pricing:
  currency: RUB
  pain_value_per_month: 1000    # величина боли в месяц
  how: >-
    избежание потерь: единственная денежная оценка получена от Татьяны —
    больше 1000 ₽/мес на выброшенное и задублированное. У мамы и Дмитрия есть
    только оценки во времени (4 и 5 часов в месяц), но ставка часа их работы
    не выяснена, поэтому время в деньги пока не переводится и в это число
    не включено. 1000 ₽ взято как консервативная нижняя граница (в
    интервью прозвучало "больше 1000", а не точная сумма).
  price: 150                    # ваша цена, обязана попасть в коридор 10-20%
  # 150 ₽ — это 15% от 1000 ₽, середина коридора (100-200 ₽). Оба прямых
  # конкурента (Finly и "Учет Продуктов") в discovery/competitors.md бесплатны,
  # поэтому любая ненулевая цена уже требует объяснения — см. ниже.
  users_month_3: 20             # сколько платящих вы рассчитываете набрать к третьему месяцу
  # Обоснование: 3 человека из ближнего круга (мама, Дмитрий, и кто-то из их
  # знакомых) + ориентировочно 17 через органические установки в RuStore и
  # посты в дачных сообществах — там уже подтверждён живой интерес к теме
  # учёта запасов (см. discovery/interviews/01-polinka.md, 02-alechin.md,
  # 03-dzhiper.md — все из одного форумного треда, где люди сами обсуждают
  # эту проблему). Цифра 20 — грубая прикидка для маленького пет-проекта,
  # не подкреплённая расчётом воронки, это стоит перепроверить после первых
  # публикаций.
  revenue_month_3: 3000          # price * users_month_3
  evidence:
    - source: interviews/06-tatyana.md
      quote: уходит больше 1000 рублей в месяц

# Почему цена не 0, хотя оба прямых конкурента бесплатны:
# У обоих конкурентов есть реальный недостаток, зафиксированный в отзывах
# пользователей (discovery/competitors.md) — навязчивая нереклама у "Учет
# Продуктов, Список Покупок" и нестабильное сканирование штрихкода у Finly.
# Ставка на то, что часть аудитории заплатит 150 ₽/мес, чтобы не иметь дела
# с рекламой и багами — но это гипотеза, а не подтверждённый находками факт:
# ни один из пяти собеседников не говорил, что готов платить за учёт запасов
# или пробовал платные приложения. Это нужно прямо проверить в интервью
# (блок "Что уже пробовали" гайда), прежде чем полагаться на эту цену.
