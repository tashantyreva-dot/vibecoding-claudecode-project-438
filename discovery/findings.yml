findings:
  - id: sticker-dating-system
    claim: |
      Единичный случай (Полинка): собеседница помечает банки бумажными стикерами
      с датой и содержимым, чтобы визуально отличать старое от нового. Значит,
      часть аудитории уже придумала себе ручной способ маркировки — задача
      «забыл, что за банка и с какого года» у неё закрыта самодельным решением,
      а не тем, что она её не замечает.
    evidence:
      - source: interviews/01-polinka.md
        quote: клеит на крышки банок бумажные стикеры с датой и коротким описанием

  - id: written-checklist-on-door
    claim: |
      Единичный случай (alechin): собеседник решает ту же задачу иначе — вешает
      на дверь погреба бумажный список содержимого и вычёркивает позиции по
      мере расхода. Показывает, что подручных способов несколько и они разные
      у разных людей, а не один общепринятый.
    evidence:
      - source: interviews/02-alechin.md
        quote: повесил на дверь погреба лист бумаги со списком содержимого

  - id: manual-methods-feel-sufficient
    claim: |
      Подтверждено двумя разными собеседниками (Полинка и alechin), которые
      решают задачу разными способами (стикеры на банках и список на двери):
      оба говорят, что их метод даёт полную видимость того, что где лежит и
      сколько осталось. Это не единичное мнение одного человека.
    evidence:
      - source: interviews/01-polinka.md
        quote: всегда видно, что где лежит
      - source: interviews/02-alechin.md
        quote: всегда видно, сколько чего ещё осталось

  - id: no-universal-system
    claim: |
      Единичное, но важное наблюдение (Джипер): организованная система учёта —
      не универсальная практика. Он прямо говорит, что знает многих, кто в
      погребах просто ставит банки на полки без всякой системы. То есть часть
      аудитории неорганизована, и продукт может быть полезен именно ей, а не
      только тем, кто уже наладил учёт руками (как Полинка и alechin).
    evidence:
      - source: interviews/03-dzhiper.md
        quote: ставят банки на полки как придётся

  - id: setup-ease-conflicting-views
    claim: |
      ПРОТИВОРЕЧИЕ между собеседниками: Полинка считает, что организовать
      систему учёта несложно при наличии места — это не большая задача.
      Джипер же говорит, что к организованной системе люди приходят только
      с годами опыта и при наличии желания. Похоже, барьер не только в
      нехватке времени или места, но и в мотивации/привычке, и это расходится
      с гипотезой из idea.md о трудоёмкости разбора запасов. Нужно разбираться
      дальше в живых интервью.
    evidence:
      - source: interviews/01-polinka.md
        quote: разобрать банки — не такая уж большая задача, на это уходит
      - source: interviews/03-dzhiper.md
        quote: к системе обычно приходят с годами

  - id: some-preserves-always-get-discarded
    claim: |
      Подтверждено двумя собеседниками с разными подходами (Полинка и Джипер):
      даже при наличии системы учёта часть заготовок всё равно не съедается и
      её выбрасывают — у Полинки по формальному правилу (старше трёх лет), у
      Джипера как общее наблюдение о старых заготовках. Организация хранения
      снижает потери, но не убирает их полностью.
    evidence:
      - source: interviews/01-polinka.md
        quote: которые простояли больше трёх лет
      - source: interviews/03-dzhiper.md
        quote: годами хранить консервацию не стоит

  - id: same-logic-for-freezer-and-pantry
    claim: |
      Подтверждено двумя собеседниками (Полинка и alechin): оба применяют один
      и тот же принцип учёта и в кладовке/погребе, и в морозилке — не смешивать
      разные группы/годы. Похоже, что разделение по типу места хранения не
      требует принципиально разных решений — логика учёта общая.
    evidence:
      - source: interviews/01-polinka.md
        quote: не сваливать всё в кучу
      - source: interviews/02-alechin.md
        quote: тот же приём для морозилки

  - id: duplicate-purchases-confirmed
    claim: |
      Подтверждено двумя разными собеседницами (мама и сама Татьяна): обе
      покупают продуктов больше, чем реально нужно/съедается, потому что не
      видят, что уже есть дома. У мамы это усиливается тем, что она ездит в
      магазин без списка три раза в неделю. Это уже не догадка из idea.md, а
      подтверждённый факт — хотя данные пока со слов близких людей, а не из
      полноценных интервью по гайду.
    evidence:
      - source: interviews/04-mama.md
        quote: продуктов больше, чем нужно
      - source: interviews/06-tatyana.md
        quote: покупает продуктов больше, чем может съесть

  - id: time-cost-unknown
    claim: |
      ЧАСТИЧНО ПРОЯСНЕНО: по оценке Татьяны, на разбор запасов и повторные
      покупки уходит от 1 часа в месяц (у неё самой) до 4-5 часов в месяц (у
      мамы и Дмитрия). Ставка часа работы ни у кого не выяснена, поэтому
      перевести время в деньги напрямую нельзя — только денежная оценка потерь
      от Татьяны (см. pricing.yml) пока в деньгах.
    evidence:
      - source: interviews/04-mama.md
        quote: уходит около 4 часов в месяц
      - source: interviews/06-tatyana.md
        quote: уходит больше 1000 рублей в месяц
